name: Wave Rider Cloud Automation

on:
  schedule:
    # 1. Market Open Scan: Monday-Friday at 14:35 UTC (15:35 CET / 09:35 EST)
    - cron: '35 14 * * 1-5'
    # 2. Intraday Scans: Monday-Friday every hour from 15:00 to 20:00 UTC (16:00 to 21:00 CET)
    - cron: '0 15,16,17,18,19,20 * * 1-5'
    # 3. Market Close Scan: Monday-Friday at 21:05 UTC (22:05 CET / 16:05 EST)
    - cron: '5 21 * * 1-5'
    # 4. Nightly Full EOD Refresh: Monday-Friday at 21:20 UTC (22:20 CET)
    - cron: '20 21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Export Mode'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - full
      command:
        description: 'Command to Execute'
        required: true
        default: 'bot-turn'
        type: choice
        options:
          - bot-turn
          - export-only
          - order
          - reset-duel
      action:
        description: 'Order Action (if command=order)'
        required: false
        default: 'BUY'
        type: choice
        options:
          - BUY
          - SELL
      ticker:
        description: 'Order Ticker (if command=order)'
        required: false
        default: ''
      shares:
        description: 'Order Shares (if command=order)'
        required: false
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wave-rider-cloud-lock
  cancel-in-progress: false

jobs:
  evaluate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Player Order (if requested)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'order' && github.event.inputs.ticker != '' }}
        run: |
          python -m src.main --order ${{ github.event.inputs.action }} ${{ github.event.inputs.ticker }} ${{ github.event.inputs.shares }}

      - name: Reset Duel (if requested)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'reset-duel' }}
        run: |
          python -m src.main --reset-duel

      - name: Autonomous Bot Turn Evaluation
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.command == 'bot-turn') }}
        run: |
          python -m src.main --bot-turn

      - name: Determine Export Mode
        id: determine_mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H%M)" = "2120" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=fast" >> $GITHUB_OUTPUT
          fi

      - name: Compile Static Cloud Bundle
        run: |
          python -m src.main --export-static --export-mode ${{ steps.determine_mode.outputs.mode }} --export-dir dist

      - name: Commit Updated Game State to Master
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game_state.json data/history/
          if git diff --staged --quiet; then
            echo "No state or portfolio changes to commit."
          else
            git commit -m "chore(bot): automated duel turn evaluation [skip ci]"
            git pull --rebase origin master
            git push origin master
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
